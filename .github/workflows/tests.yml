name: Benchmark validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: docs/env_lockfile.txt
      - name: Create isolated Python environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import venv

          root = Path(os.environ['RUNNER_TEMP']) / 'ivafr-venv'
          venv.create(root, with_pip=True)
          scripts = root / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(scripts) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'VIRTUAL_ENV={root}\n')
      - name: Verify environment isolation
        run: python -c "import sys; assert sys.prefix != sys.base_prefix, 'CI must use its virtual environment'"
      - run: python -m pip install -r docs/env_lockfile.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m ruff check --select E9,F821,F822,F823 src tests scripts
      - name: Run full test suite
        run: python -m pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && hashFiles('test-results.xml') != '' }}
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: error
